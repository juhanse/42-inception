services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build: 
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception

  redis:
    container_name: redis
    image: redis
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    restart: always
    networks:
      - inception

  wordpress:
    container_name: wordpress
    image: wordpress
    build: 
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - adminer
      - astro
    env_file: .env
    volumes:
      - wordpress:/var/www/html
      - adminer_data:/var/www/adminer:ro
      - nginx_logs:/var/log/nginx
      - goaccess_data:/var/www/goaccess:ro
    networks:
      - inception

  goaccess:
    container_name: goaccess
    image: goaccess
    build:
      context: ./requirements/bonus/goaccess
      dockerfile: Dockerfile
    restart: always
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - goaccess_data:/var/www/goaccess
    networks:
      - inception

  ftp:
    container_name: ftp
    image: ftp
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - wordpress
    ports:
      - "21:21"
      - "21100-21105:21100-21105"
    env_file: .env
    secrets:
      - ftp_password
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  adminer:
    container_name: adminer
    image: adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - mariadb
    volumes:
      - adminer_data:/var/www/adminer
    networks:
      - inception

  astro:
    container_name: astro
    image: astro
    build:
      context: ./requirements/bonus/astro
      dockerfile: Dockerfile
    restart: always
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  adminer_data:
    name: adminer_data
  nginx_logs:
    name: nginx_logs
  goaccess_data:
    name: goaccess_data
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WP_DATA_PATH}
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MARIADB_DATA_PATH}
